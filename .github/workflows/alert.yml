name: Biopharma Alert Bot

on:
  # 스케줄 일시 중단 — Gmail 스팸 차단(550 5.7.1) 대응
  # 쿨다운/발송 상한 구현 후 아래 주석을 해제한다.
  # schedule:
  #   - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert bot
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python test_dart.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_reports.json pending_digest.json immediate_queue.json last_immediate_alert.json
          git diff --staged --quiet || git commit -m "Update state files [skip ci]"
          git pull --rebase
          git push